<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>單元列表</title>
  <link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <header class="site-header">
    <h1 id="course-title">載入中...</h1>
    <a class="home-link" id="back-link" href="index.html">← 回上一層</a>
  </header>

  <main>
    <input
      type="search"
      id="unit-search"
      class="search-input"
      placeholder="搜尋單元，例如：Unit 12"
    />
    <div class="deck-grid" id="unit-grid"></div>
    <p class="empty-state" id="unit-empty" hidden>找不到符合的單元，請換個關鍵字試試。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/sheet.js?v=4"></script>
  <script src="js/directory.js?v=4"></script>
  <script src="js/course.js?v=4"></script>
</body>
</html>
