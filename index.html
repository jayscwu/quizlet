<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>英文題庫測驗網</title>
  <link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
  <header class="site-header">
    <h1>📚 英文題庫測驗網</h1>
    <button class="home-link" id="logout-btn" hidden>登出</button>
  </header>

  <main>
    <p class="subtitle">選擇一份題庫，開始測驗！</p>
    <input
      type="search"
      id="deck-search"
      class="search-input"
      placeholder="搜尋單元，例如：Unit 12"
    />
    <div class="deck-grid" id="deck-grid"></div>
    <p class="empty-state" id="deck-empty" hidden>找不到符合的題庫，請換個關鍵字試試。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/config.js?v=2"></script>
  <script src="js/sheet.js?v=2"></script>
  <script src="js/home.js?v=2"></script>
</body>
</html>
