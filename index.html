<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>題庫測驗網</title>
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <header class="site-header">
    <h1>📚 題庫測驗網 <span class="role-badge" id="role-badge" hidden></span></h1>
    <div class="header-actions">
      <a class="home-link" id="quiz-log-link" href="#" target="_blank" rel="noopener" hidden>📊 測驗紀錄</a>
      <button class="home-link" id="logout-btn" hidden>登出</button>
    </div>
  </header>

  <main>
    <input
      type="search"
      id="unit-search"
      class="search-input"
      placeholder="🔍 搜尋單元、課程或科目關鍵字，例如：英文 12"
      autofocus
    />
    <div class="chip-row" id="subject-chips"></div>
    <div class="deck-grid" id="unit-grid"></div>
    <p class="empty-state" id="unit-empty" hidden>找不到符合的單元，請換個關鍵字或篩選條件試試。</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="js/auth.js?v=8"></script>
  <script src="js/config.js?v=8"></script>
  <script src="js/sheet.js?v=8"></script>
  <script src="js/directory.js?v=8"></script>
  <script src="js/quizlog.js?v=8"></script>
  <script src="js/home.js?v=8"></script>
</body>
</html>
